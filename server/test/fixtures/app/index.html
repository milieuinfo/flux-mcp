<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Containeraanvraag</title>
        <style>
            .foutmelding {
                color: #db3434;
            }

            .knop {
                margin-left: 1rem;
                padding: 0.8rem 1.6rem;
                border: 1px solid #0055cc;
                background: #fff;
                color: #0055cc;
            }
        </style>
        <script type="module" src="/src/main.js"></script>
    </head>
    <body>
        <vl-functional-header
            title="Containeraanvraag"
            hide-back-link
            custom-css="
                .vl-functional-header__sub-actions, .vl-functional-header__sub__action { width: 100% }
                ::slotted(.vl-group) { width: 100% }
            "
        >
            <div class="vl-group vl-group--space-between" slot="sub-title">
                <span>Gemeente Voorbeeld</span>
                <vl-search id="zoek-aanvraag" label="Aanvraagnummer" inline></vl-search>
            </div>
        </vl-functional-header>
        <main id="inhoud" class="vl-layout">
            <p id="zoekresultaat"></p>
            <form id="aanvraag">
                <vl-input-field id="naam" name="naam" label="Naam" required></vl-input-field>
                <vl-input-field id="email" name="email" type="email" placeholder="E-mailadres"></vl-input-field>
                <vl-datepicker
                    id="datum"
                    name="datum"
                    label="Leverdatum"
                    min-date="today"
                    disable-mobile-native-input
                    required
                ></vl-datepicker>
                <vl-datepicker id="ophaaldatum" name="ophaaldatum" label="Ophaaldatum"></vl-datepicker>
                <p id="ophaaldatum-fout" class="foutmelding" hidden>Fout.</p>
                <vl-button type="submit">Vraag aan</vl-button>
                <button id="annuleer" class="knop" type="button">Annuleren</button>
            </form>
            <vl-alert id="bevestiging" type="success" title="Aanvraag ontvangen" closable="false" hidden>
                <span>We leveren de container op de gevraagde dag.</span>
            </vl-alert>
            <vl-description-data id="samenvatting" hidden>
                <div class="items">
                    <vl-description-data-item id="samenvatting-naam" label="Naam"></vl-description-data-item>
                    <vl-description-data-item id="samenvatting-datum" label="Leverdatum"></vl-description-data-item>
                </div>
            </vl-description-data>
        </main>
    </body>
</html>
