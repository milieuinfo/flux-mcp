<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Containeraanvraag</title>
        <script type="module" src="/src/main.js"></script>
    </head>
    <body>
        <vl-functional-header title="Containeraanvraag" sub-title="Gemeente Voorbeeld"></vl-functional-header>
        <main id="inhoud" class="vl-layout">
            <form id="aanvraag">
                <vl-input-field id="naam" name="naam" label="Naam" required></vl-input-field>
                <vl-datepicker
                    id="datum"
                    name="datum"
                    label="Leverdatum"
                    min-date="today"
                    disable-mobile-native-input
                    required
                ></vl-datepicker>
                <vl-button type="submit">Vraag aan</vl-button>
            </form>
            <vl-alert id="bevestiging" type="success" title="Aanvraag ontvangen" hidden>
                <span>We leveren de container op de gevraagde dag.</span>
            </vl-alert>
            <vl-description-data id="samenvatting" hidden>
                <div class="items">
                    <vl-description-data-item id="samenvatting-naam" label="Naam"></vl-description-data-item>
                    <vl-description-data-item id="samenvatting-datum" label="Leverdatum"></vl-description-data-item>
                </div>
            </vl-description-data>
        </main>
    </body>
</html>
